<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Billing</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Poppins,sans-serif;
}

body{
background:#f5f7fb;
padding-bottom:130px;
}

.header{
position:sticky;
top:0;
background:white;
padding:18px;
box-shadow:0 2px 10px rgba(0,0,0,.08);
z-index:100;
}

.title{
font-size:24px;
font-weight:700;
margin-bottom:12px;
}

.search{
width:100%;
padding:15px;
border:none;
border-radius:15px;
background:#eef2f7;
outline:none;
font-size:16px;
}

.customer{
background:white;
margin:15px;
padding:18px;
border-radius:18px;
box-shadow:0 4px 15px rgba(0,0,0,.05);
}

.customer input{
width:100%;
padding:12px;
margin-top:10px;
border:none;
background:#eef2f7;
border-radius:10px;
}

.cart{
margin:15px;
}

.item{
background:white;
padding:18px;
border-radius:18px;
margin-bottom:12px;
box-shadow:0 4px 15px rgba(0,0,0,.05);
}

.name{
font-size:18px;
font-weight:600;
}

.price{
color:#2563eb;
font-size:20px;
margin-top:5px;
}

.qty{
display:flex;
gap:10px;
margin-top:12px;
}

.qty button{
width:40px;
height:40px;
border:none;
border-radius:10px;
font-size:20px;
background:#2563eb;
color:white;
}

.qty input{
width:60px;
text-align:center;
border:none;
background:#eef2f7;
border-radius:10px;
}

.summary{
position:fixed;
bottom:70px;
left:0;
right:0;
background:white;
padding:18px;
box-shadow:0 -3px 15px rgba(0,0,0,.1);
}

.row{
display:flex;
justify-content:space-between;
margin:8px 0;
font-size:16px;
}

.total{
font-size:24px;
font-weight:bold;
color:#2563eb;
}

.billbtn{
width:100%;
padding:16px;
margin-top:15px;
border:none;
border-radius:14px;
background:#16a34a;
color:white;
font-size:18px;
font-weight:600;
}

.bottom{
position:fixed;
bottom:0;
left:0;
right:0;
height:70px;
background:white;
display:flex;
justify-content:space-around;
align-items:center;
box-shadow:0 -2px 12px rgba(0,0,0,.08);
}

.nav{
text-align:center;
font-size:12px;
}

.nav div{
font-size:24px;
}

</style>

</head>

<body>

<div class="header">

<div class="title">

🧾 Billing

</div>

<input class="search" placeholder="Search Product...">

</div>

<div class="customer">

<b>Customer Details</b>

<input placeholder="Customer Name">

<input placeholder="Phone Number">

</div>

<div class="cart">

<div class="item">

<div class="name">

Classmates Long Notebook

</div>

<div class="price">

₹128

</div>

<div class="qty">

<button>-</button>

<input value="1">

<button>+</button>

</div>

</div>

<div class="item">

<div class="name">

Doms Drawing Book

</div>

<div class="price">

₹70

</div>

<div class="qty">

<button>-</button>

<input value="2">

<button>+</button>

</div>

</div>

</div>

<div class="summary">

<div class="row">

<span>Subtotal</span>

<span>₹268</span>

</div>

<div class="row">

<span>Discount</span>

<span>₹0</span>

</div>

<div class="row">

<span>GST</span>

<span>₹0</span>

</div>

<hr style="margin:12px 0;">

<div class="row total">

<span>Total</span>

<span>₹268</span>

</div>

<button class="billbtn">

Generate Bill

</button>

</div>

<div class="bottom">

<div class="nav">

<div>🏠</div>

Home

</div>

<div class="nav">

<div>📦</div>

Products

</div>

<div class="nav">

<div>🔍</div>

Search

</div>

<div class="nav">

<div>🧾</div>

Billing

</div>

<div class="nav">

<div>⚙️</div>

Settings

</div>

</div>

</body>

</html>
