<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Shop Manager</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Poppins,sans-serif;
}

body{

background:#f5f7fb;

}

.header{

position:fixed;

top:0;

left:0;

right:0;

height:70px;

background:white;

display:flex;

justify-content:space-between;

align-items:center;

padding:20px;

box-shadow:0 2px 10px rgba(0,0,0,.08);

z-index:1000;

}

.logo{

font-size:22px;

font-weight:bold;

}

.profile{

width:45px;

height:45px;

border-radius:50%;

background:#2563eb;

color:white;

display:flex;

justify-content:center;

align-items:center;

font-weight:bold;

}

.content{

padding:90px 15px 100px;

}

.search{

width:100%;

padding:15px;

border:none;

border-radius:15px;

background:white;

box-shadow:0 2px 10px rgba(0,0,0,.05);

outline:none;

font-size:15px;

}

.grid{

display:grid;

grid-template-columns:repeat(2,1fr);

gap:15px;

margin-top:20px;

}

.card{

background:white;

padding:20px;

border-radius:20px;

box-shadow:0 3px 12px rgba(0,0,0,.06);

text-align:center;

cursor:pointer;

transition:.2s;

}

.card:active{

transform:scale(.97);

}

.icon{

font-size:35px;

margin-bottom:10px;

}

.name{

font-weight:600;

}

.stats{

margin-top:25px;

display:grid;

grid-template-columns:repeat(2,1fr);

gap:15px;

}

.stat{

background:white;

padding:18px;

border-radius:18px;

box-shadow:0 3px 12px rgba(0,0,0,.05);

}

.number{

font-size:28px;

font-weight:bold;

margin-top:8px;

color:#2563eb;

}

.bottom{

position:fixed;

bottom:0;

left:0;

right:0;

height:70px;

background:white;

display:flex;

justify-content:space-around;

align-items:center;

box-shadow:0 -2px 12px rgba(0,0,0,.08);

}

.nav{

display:flex;

flex-direction:column;

align-items:center;

font-size:12px;

color:#666;

cursor:pointer;

}

.nav span{

font-size:24px;

}

.fab{

position:fixed;

bottom:85px;

right:20px;

width:60px;

height:60px;

border-radius:50%;

background:#2563eb;

display:flex;

justify-content:center;

align-items:center;

color:white;

font-size:35px;

box-shadow:0 8px 20px rgba(37,99,235,.35);

cursor:pointer;

}

</style>

</head>

<body>

<div class="header">

<div class="logo">

🏪 Shop Manager

</div>

<div class="profile">

D

</div>

</div>

<div class="content">

<input class="search"

placeholder="Search products, brands, barcode...">

<div class="grid">

<div class="card">

<div class="icon">📦</div>

<div class="name">Products</div>

</div>

<div class="card">

<div class="icon">🏢</div>

<div class="name">Brands</div>

</div>

<div class="card">

<div class="icon">📊</div>

<div class="name">Stock</div>

</div>

<div class="card">

<div class="icon">🧾</div>

<div class="name">Billing</div>

</div>

<div class="card">

<div class="icon">👥</div>

<div class="name">Customers</div>

</div>

<div class="card">

<div class="icon">📈</div>

<div class="name">Reports</div>

</div>

</div>

<div class="stats">

<div class="stat">

Total Products

<div class="number">

0

</div>

</div>

<div class="stat">

Low Stock

<div class="number">

0

</div>

</div>

<div class="stat">

Today's Bills

<div class="number">

0

</div>

</div>

<div class="stat">

Brands

<div class="number">

4

</div>

</div>

</div>

</div>

<div class="fab">

+

</div>

<div class="bottom">

<div class="nav">

<span>🏠</span>

Home

</div>

<div class="nav">

<span>📦</span>

Products

</div>

<div class="nav">

<span>🔍</span>

Search

</div>

<div class="nav">

<span>🧾</span>

Billing

</div>

<div class="nav">

<span>⚙️</span>

Settings

</div>

</div>

</body>

</html>
