<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>DARKI / NUR ISLAM — Choose Your Reality</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:#000;color:#f5f5f5;font-family:SFMono-Regular,Consolas,"Liberation Mono",monospace;overflow:hidden}body{position:relative}.site{position:fixed;inset:0;border:0;width:100%;height:100%;background:#000}.gate{position:fixed;inset:0;z-index:20;background:#000;display:flex;align-items:center;justify-content:center;padding:24px;overflow:auto}.gate:before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 50% 45%,rgba(255,255,255,.055),transparent 42%),linear-gradient(90deg,transparent 49.9%,rgba(255,255,255,.035) 50%,transparent 50.1%);pointer-events:none}.grid{position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.025) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.025) 1px,transparent 1px);background-size:48px 48px;mask-image:linear-gradient(to bottom,transparent,black 18%,black 82%,transparent)}.box{position:relative;width:min(1040px,100%);border:1px solid #383838;background:#030303;box-shadow:0 0 70px rgba(255,255,255,.04);padding:54px}.topline{display:flex;justify-content:space-between;gap:20px;border-bottom:1px solid #292929;padding-bottom:18px;color:#777;font-size:9px;letter-spacing:2px}.warning{color:#f4f4f4}.mark{font-size:10px}.title{font-size:clamp(42px,7vw,88px);line-height:.86;letter-spacing:-6px;font-weight:950;margin:42px 0 17px}.sub{color:#aaa;font-size:11px;letter-spacing:2px;line-height:1.7;max-width:680px}.prompt{margin:42px 0 22px;font-size:10px;color:#777;letter-spacing:2px}.choices{display:grid;grid-template-columns:1fr 1fr;gap:16px}.choice{appearance:none;border:1px solid #3a3a3a;background:#050505;color:#f5f5f5;text-align:left;padding:27px;cursor:pointer;min-height:190px;position:relative;transition:.25s}.choice:hover{border-color:#aaa;background:#0a0a0a;transform:translateY(-3px)}.choice:after{content:"↗";position:absolute;right:20px;bottom:17px;font-size:21px;color:#777}.num{font-size:9px;color:#666;letter-spacing:2px}.choice h2{font-size:22px;letter-spacing:-.5px;margin:25px 0 12px}.choice p{font-size:10px;color:#aaa;line-height:1.8;max-width:390px}.messy h2{font-size:24px}.clean h2{font-size:24px}.footerline{margin-top:30px;padding-top:18px;border-top:1px solid #222;display:flex;justify-content:space-between;color:#555;font-size:8px;letter-spacing:1.5px}.glitch{display:inline-block;position:relative}.glitch:after{content:"";position:absolute;left:2px;top:0;width:100%;height:100%;background:#fff;mix-blend-mode:difference;opacity:.08;animation:flicker 2.5s infinite}@keyframes flicker{0%,92%,100%{opacity:.05}94%{opacity:.22}96%{opacity:.02}}.hide{animation:leave .45s forwards}@keyframes leave{to{opacity:0;transform:scale(1.025);visibility:hidden}}@media(max-width:700px){.box{padding:28px}.title{letter-spacing:-3px;margin-top:30px}.choices{grid-template-columns:1fr}.choice{min-height:155px}.prompt{margin-top:30px}.footerline{display:none}}
</style>
</head>
<body>
<iframe class="site" src="portfolio.html" title="DARKI portfolio"></iframe>
<div class="gate" id="gate">
<div class="grid"></div>
<section class="box">
<div class="topline"><span class="warning">[ PERSONALITY CHECK / 01 ]</span><span class="mark">DARKI // NUR ISLAM</span></div>
<h1 class="title glitch">CHOOSE YOUR <br>REALITY_</h1>
<p class="sub">Before you enter, answer one extremely important question:<br>how much chaos can your eyes comfortably handle?</p>
<div class="prompt">&gt; SELECT YOUR INTERFACE PREFERENCE</div>
<div class="choices">
<button class="choice messy" onclick="enter('chaos')"><span class="num">[ 01 / CHAOS MODE ]</span><h2>I LOVE MESS / BRAIN ROT</h2><p>Give me the weird stuff. Futuristic interfaces, experimental layouts, controlled chaos and a portfolio that looks like it escaped from the year 2099.</p></button>
<button class="choice clean" onclick="enter('clean')"><span class="num">[ 02 / ORDER MODE ]</span><h2>I LOVE CLEAN &amp; ORGANIZED</h2><p>Give me structure. Sharp alignment, calm spacing, disciplined pixels — the kind of design that makes an organized uncle quietly proud.</p></button>
</div>
<div class="footerline"><span>NO WRONG ANSWERS. JUST DIFFERENT OPERATING SYSTEMS.</span><span>ENTER →</span></div>
</section>
</div>
<script>
function enter(mode){
 const gate=document.getElementById('gate');
 gate.classList.add('hide');
 document.body.dataset.preference=mode;
 setTimeout(()=>gate.remove(),500);
}
</script>
</body>
</html>
