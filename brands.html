<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Brands</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Poppins,sans-serif;
}

body{
background:#f5f7fb;
padding-bottom:90px;
}

header{
position:sticky;
top:0;
background:white;
padding:18px;
box-shadow:0 2px 10px rgba(0,0,0,.08);
z-index:100;
}

h1{
font-size:24px;
margin-bottom:12px;
}

input{
width:100%;
padding:14px;
border:none;
background:#eef2f7;
border-radius:14px;
outline:none;
font-size:15px;
}

.container{
padding:16px;
}

.brand-card{
background:white;
border-radius:18px;
padding:18px;
margin-bottom:15px;
box-shadow:0 4px 15px rgba(0,0,0,.05);
display:flex;
justify-content:space-between;
align-items:center;
}

.brand-info h2{
font-size:19px;
}

.brand-info p{
color:gray;
margin-top:5px;
font-size:14px;
}

.actions{
display:flex;
gap:8px;
}

button{
padding:10px 14px;
border:none;
border-radius:10px;
cursor:pointer;
font-size:14px;
}

.edit{
background:#2563eb;
color:white;
}

.delete{
background:#ef4444;
color:white;
}

.fab{
position:fixed;
bottom:85px;
right:20px;
width:65px;
height:65px;
border-radius:50%;
background:#2563eb;
color:white;
font-size:38px;
display:flex;
justify-content:center;
align-items:center;
box-shadow:0 10px 25px rgba(37,99,235,.35);
cursor:pointer;
}

.bottom{
position:fixed;
bottom:0;
left:0;
right:0;
height:70px;
background:white;
display:flex;
justify-content:space-around;
align-items:center;
box-shadow:0 -2px 15px rgba(0,0,0,.08);
}

.item{
text-align:center;
font-size:12px;
}

.item div{
font-size:24px;
}

</style>

</head>

<body>

<header>

<h1>🏢 Brands</h1>

<input type="text" placeholder="Search Brand...">

</header>

<div class="container">

<div class="brand-card">

<div class="brand-info">

<h2>Classmates</h2>

<p>248 Products</p>

</div>

<div class="actions">

<button class="edit">Edit</button>

<button class="delete">Delete</button>

</div>

</div>

<div class="brand-card">

<div class="brand-info">

<h2>Klassnote</h2>

<p>132 Products</p>

</div>

<div class="actions">

<button class="edit">Edit</button>

<button class="delete">Delete</button>

</div>

</div>

<div class="brand-card">

<div class="brand-info">

<h2>Doms</h2>

<p>186 Products</p>

</div>

<div class="actions">

<button class="edit">Edit</button>

<button class="delete">Delete</button>

</div>

</div>

<div class="brand-card">

<div class="brand-info">

<h2>Saathi</h2>

<p>94 Products</p>

</div>

<div class="actions">

<button class="edit">Edit</button>

<button class="delete">Delete</button>

</div>

</div>

</div>

<div class="fab">

+

</div>

<div class="bottom">

<div class="item">

<div>🏠</div>

Home

</div>

<div class="item">

<div>📦</div>

Products

</div>

<div class="item">

<div>🔍</div>

Search

</div>

<div class="item">

<div>🧾</div>

Bills

</div>

<div class="item">

<div>⚙️</div>

Settings

</div>

</div>

</body>

</html>
