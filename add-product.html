<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Add Product</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Poppins,sans-serif;
}

body{
background:#f5f7fb;
padding-bottom:100px;
}

.header{
position:sticky;
top:0;
background:white;
padding:18px;
font-size:22px;
font-weight:700;
box-shadow:0 2px 12px rgba(0,0,0,.08);
z-index:100;
}

.container{
padding:18px;
}

.card{
background:white;
border-radius:20px;
padding:18px;
margin-bottom:18px;
box-shadow:0 4px 15px rgba(0,0,0,.06);
}

.card h3{
margin-bottom:15px;
font-size:18px;
}

label{
display:block;
margin-top:14px;
margin-bottom:6px;
font-size:14px;
font-weight:500;
}

input,
select,
textarea{
width:100%;
padding:14px;
border:none;
background:#eef2f7;
border-radius:12px;
font-size:15px;
outline:none;
}

textarea{
resize:none;
height:90px;
}

.row{
display:grid;
grid-template-columns:1fr 1fr;
gap:12px;
}

.upload{
border:2px dashed #bbb;
border-radius:16px;
padding:30px;
text-align:center;
color:#777;
}

.save{
width:100%;
padding:16px;
border:none;
border-radius:14px;
background:#2563eb;
color:white;
font-size:18px;
font-weight:600;
margin-top:20px;
}

.reset{
width:100%;
padding:16px;
border:none;
border-radius:14px;
background:#ef4444;
color:white;
font-size:17px;
margin-top:12px;
}

.bottomnav{

position:fixed;

bottom:0;

left:0;

right:0;

height:70px;

background:white;

display:flex;

justify-content:space-around;

align-items:center;

box-shadow:0 -2px 15px rgba(0,0,0,.08);

}

.item{
text-align:center;
font-size:12px;
}

.item div{
font-size:23px;
}

</style>

</head>

<body>

<div class="header">

➕ Add Product

</div>

<div class="container">

<div class="card">

<h3>Basic Information</h3>

<label>Category</label>

<select>

<option>Notebook</option>

<option>Register</option>

<option>Drawing Book</option>

<option>Pen</option>

<option>Pencil</option>

</select>

<label>Brand</label>

<select>

<option>Classmates</option>

<option>Klassnote</option>

<option>Doms</option>

<option>Saathi</option>

</select>

<label>Product Name</label>

<input placeholder="Long Notebook">

</div>

<div class="card">

<h3>Product Details</h3>

<div class="row">

<div>

<label>Size</label>

<input placeholder="A4">

</div>

<div>

<label>Pages</label>

<input placeholder="172">

</div>

</div>

<div class="row">

<div>

<label>Binding</label>

<input placeholder="Soft">

</div>

<div>

<label>Color</label>

<input placeholder="Blue">

</div>

</div>

</div>

<div class="card">

<h3>Pricing</h3>

<div class="row">

<div>

<label>MRP</label>

<input placeholder="140">

</div>

<div>

<label>Selling Price</label>

<input placeholder="128">

</div>

</div>

<label>Wholesale Price</label>

<input placeholder="118">

</div>

<div class="card">

<h3>Inventory</h3>

<div class="row">

<div>

<label>Stock</label>

<input placeholder="250">

</div>

<div>

<label>Rack</label>

<input placeholder="B2">

</div>

</div>

<label>Barcode</label>

<input placeholder="Scan or Enter">

</div>

<div class="card">

<h3>Product Image</h3>

<div class="upload">

📷

<br><br>

Tap to Upload Image

</div>

</div>

<div class="card">

<h3>Description</h3>

<textarea placeholder="Optional notes..."></textarea>

</div>

<button class="save">

💾 Save Product

</button>

<button class="reset">

🗑 Clear Form

</button>

</div>

<div class="bottomnav">

<div class="item">

<div>🏠</div>

Home

</div>

<div class="item">

<div>📦</div>

Products

</div>

<div class="item">

<div>➕</div>

Add

</div>

<div class="item">

<div>🧾</div>

Bills

</div>

<div class="item">

<div>⚙️</div>

Settings

</div>

</div>

</body>
</html>
