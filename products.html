<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Products</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Poppins,sans-serif;
}

body{
background:#f5f6fa;
padding-bottom:100px;
}

header{

position:sticky;

top:0;

background:white;

padding:15px;

box-shadow:0 2px 10px rgba(0,0,0,.08);

z-index:100;

}

.title{

font-size:22px;

font-weight:700;

margin-bottom:12px;

}

.search{

width:100%;

padding:14px;

border:none;

border-radius:15px;

background:#eef2f7;

outline:none;

font-size:15px;

}

.filters{

display:flex;

overflow:auto;

gap:10px;

padding:15px;

}

.filter{

padding:10px 18px;

background:white;

border-radius:30px;

white-space:nowrap;

box-shadow:0 2px 8px rgba(0,0,0,.08);

cursor:pointer;

}

.container{

padding:15px;

}

.product{

background:white;

border-radius:20px;

padding:18px;

margin-bottom:15px;

box-shadow:0 5px 15px rgba(0,0,0,.06);

}

.top{

display:flex;

justify-content:space-between;

}

.brand{

font-size:12px;

color:#666;

}

.name{

font-size:20px;

font-weight:700;

margin-top:5px;

}

.price{

font-size:24px;

font-weight:bold;

color:#1d4ed8;

margin-top:10px;

}

.tag{

display:inline-block;

padding:6px 12px;

border-radius:20px;

background:#dbeafe;

margin-top:8px;

font-size:12px;

}

.details{

margin-top:15px;

display:grid;

grid-template-columns:repeat(2,1fr);

gap:10px;

}

.box{

background:#f8fafc;

padding:10px;

border-radius:12px;

font-size:13px;

}

.buttons{

display:flex;

gap:10px;

margin-top:18px;

}

button{

flex:1;

padding:12px;

border:none;

border-radius:12px;

font-weight:600;

cursor:pointer;

}

.edit{

background:#2563eb;

color:white;

}

.stock{

background:#16a34a;

color:white;

}

.delete{

background:#ef4444;

color:white;

margin-top:10px;

width:100%;

}

.fab{

position:fixed;

bottom:85px;

right:20px;

width:65px;

height:65px;

background:#2563eb;

border-radius:50%;

color:white;

display:flex;

justify-content:center;

align-items:center;

font-size:38px;

box-shadow:0 10px 25px rgba(37,99,235,.4);

}

.bottom{

position:fixed;

bottom:0;

left:0;

right:0;

height:70px;

background:white;

display:flex;

justify-content:space-around;

align-items:center;

box-shadow:0 -2px 15px rgba(0,0,0,.08);

}

.item{

text-align:center;

font-size:12px;

}

.item div{

font-size:24px;

}

</style>

</head>

<body>

<header>

<div class="title">

📦 Products

</div>

<input class="search" placeholder="Search brand, pages, size, price...">

</header>

<div class="filters">

<div class="filter">All</div>

<div class="filter">Classmates</div>

<div class="filter">Klassnote</div>

<div class="filter">Doms</div>

<div class="filter">Saathi</div>

<div class="filter">Registers</div>

</div>

<div class="container">

<div class="product">

<div class="top">

<div>

<div class="brand">

CLASSMATES

</div>

<div class="name">

Long Notebook

</div>

</div>

<div>

⭐

</div>

</div>

<div class="price">

₹128

</div>

<div class="tag">

172 Pages • A4

</div>

<div class="details">

<div class="box">

Stock<br><b>150</b>

</div>

<div class="box">

Rack<br><b>B2</b>

</div>

<div class="box">

MRP<br><b>₹140</b>

</div>

<div class="box">

Wholesale<br><b>₹118</b>

</div>

</div>

<div class="buttons">

<button class="edit">

Edit

</button>

<button class="stock">

+ Stock

</button>

</div>

<button class="delete">

Delete Product

</button>

</div>

</div>

<div class="fab">

+

</div>

<div class="bottom">

<div class="item">

<div>🏠</div>

Home

</div>

<div class="item">

<div>📦</div>

Products

</div>

<div class="item">

<div>🔍</div>

Search

</div>

<div class="item">

<div>🧾</div>

Bills

</div>

<div class="item">

<div>⚙️</div>

Settings

</div>

</div>

</body>
</html>
